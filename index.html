<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">

<style>
    html, body {
        background-color: #000;
        color: white;
        margin: 0;
        height: 100%;
    }
</style>
<head>
  <meta charset="UTF-8">
  <title>Ticketing</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <link href="https://db.onlinewebfonts.com/c/5794f7113416487bee01f65ea0eb0571?family=Univers+Next+W04+630+Bold" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dein App-Name">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">




</head>
<body>
<div id="destroy">
<br>
    <button class="prefill" onclick="onElChange()">Europa-League vorausfüllen</button>
    <button class="prefill"  onclick="onBlChange()">Bundesliga vorausfüllen</button>
    <br>
  <p>Anzahl an Tickets</p>
  <label for="anzahl"></label><input id="anzahl"  type="number">
  <p>Blocknummer</p>
  <label for="block"></label><input id="block" type="number">
  <p>Datum</p>
  <label for="spieltag"></label><input id="spieltag" type="datetime-local">
  <p>Gegnername</p>
  <label for="name"></label><input id="name" type="text">
  <br>
  <button class="nonprefill" onclick="start('img/ohnetextel.mp4')">Europa-League Ticket</button>
    <button class="nonprefill" onclick="start('img/ohnetextbuli.mp4')">Bundesliga Ticket</button>
</div>
<div class="container">
  <div id="slider" ontouchstart="startTouch(event)" ontouchmove="moveTouch(event)" ontouchend="endTouch()">
    <div class="box outer"><img class="card" src="img/ohnetextkarteeuro.png"></div>
    <div class="box" id="init">
      <video autoplay loop muted playsinline class="balkenvideo">
        <source src="img/ohnetext.mp4" type="video/mp4">
      </video>
      <img class="infoicon" src="img/iconinfo.png" onclick="iclicked(this)">

      <p class="saison" style="font-size: 45px; font-weight: bold; position: absolute; top: 50px; left: 220px; letter-spacing: -1px; transform: scaleX(0.9); /* kleiner als 1 = schmaler */
  display: inline-block; ">UEFA EUROPA LEAGUE<br> 2024/25</p>

      <p class="gamename">Eintracht Frankfurt vs. FC Viktoria Plzeň</p>
      <p class="blocknumber">42</p>
      <p class="tribune">Unterrang Nordwestkurve</p>
      <p class="date">5.4.2024, 20:30 Uhr</p>
      <p class="rang">U</p>
    </div>
    <div class="box outer" id="last"><img class="card" src="img/ohnetextkarte.png"></div>
  </div>
</div>
<div id="redline"></div>
<div id="whiteline"></div>
<img id="arrow"  src="img/iconarrow.png">
<img id="bars" onclick="barsclicked()" src="img/iconbars.png">
<img id="bigpullup" src="img/bigpullup.png">
<img id="pullup" src="img/pullup.png">
<img id="dots"  onclick="dotsclicked()" src="img/icondots.png">
<img id="cross" src="img/iconcross.png" onclick="barsclicked()">
</body>
<script src="js/app.js">

</script>
</html>
